<!DOCTYPE html>
<html>
<head>
  <title>Content Templatizer</title>
  <style>
    body { width: 300px; padding: 10px; font-family: Arial, sans-serif; }
    label { display: block; margin-top: 10px; }
    select, input, textarea { width: 100%; margin-top: 5px; }
    textarea { height: 100px; }
    button { margin-top: 10px; }
  </style>
</head>
<body>
  <div id="mainSection">
    <textarea id="selectedPost" placeholder="Selected post will appear here" readonly></textarea>
    <button id="templatizeBtn">Templatize</button>
    <textarea id="templateOutput" placeholder="Templatized output will appear here" readonly></textarea>
    <button id="openSettingsBtn">Open Settings</button>
  </div>

  <div id="settingsSection" style="display:none;">
    <select id="industrySelect">
      <option value="">Select Industry</option>
      <option value="tech">Technology</option>
      <option value="finance">Finance</option>
      <option value="healthcare">Healthcare</option>
    </select>
    <input type="text" id="targetMarket" placeholder="Target Market">
    <input type="text" id="audience" placeholder="Target Audience">
    <input type="text" id="keyProducts" placeholder="Key Products/Services">
    <button id="saveSettingsBtn">Save Settings</button>
    <button id="closeSettingsBtn">Close Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
