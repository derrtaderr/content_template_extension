<!DOCTYPE html>
<html>
<head>
  <title>Content Templatizer</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
  <div id="mainSection">
    <h1>Content Templatizer</h1>
    <button id="refreshBtn">Refresh Post</button>
    <div id="selectedPostContainer"></div>
    <button id="templatizeBtn">Templatize</button>
    <div id="templateResult">
      <h2>Framework: <span id="frameworkOutput"></span></h2>
      <div id="templateOutput"></div>
      <h3>Placeholders:</h3>
      <ul id="placeholderList"></ul>
    </div>
    <button id="saveTemplateBtn">Save Template</button>
    <button id="displayTemplatesBtn">My Templates</button>
    <ul id="templateList"></ul>
    <button id="openSettingsBtn">Settings</button>
  </div>

  <div id="settingsSection" style="display: none;">
    <h2>Settings</h2>
    <div id="apiKeySection">
      <label for="apiKey">Claude API Key (required):</label>
      <input type="password" id="apiKey">
      <p class="help-text">You need to set your Claude API key to use the templatization feature.</p>
    </div>
    <label for="industrySelect">Your Industry:</label>
    <select id="industrySelect">
      <option value="">Select an industry</option>
      <option value="technology">Technology</option>
      <option value="finance">Finance</option>
      <option value="healthcare">Healthcare</option>
      <option value="education">Education</option>
      <option value="marketing">Marketing</option>
      <option value="other">Other</option>
    </select>
    <label for="targetMarket">Target Market:</label>
    <input type="text" id="targetMarket">
    <label for="audience">Target Audience:</label>
    <input type="text" id="audience">
    <label for="keyProducts">Key Products/Services:</label>
    <input type="text" id="keyProducts">
    <button id="saveSettingsBtn">Save Settings</button>
    <button id="closeSettingsBtn">Close</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
