<!DOCTYPE html>
<html>
<head>
  <title>Content Templatizer</title>
  <style>
    body { width: 400px; padding: 10px; font-family: Arial, sans-serif; }
    textarea { width: 100%; height: 200px; margin-bottom: 10px; white-space: pre-wrap; }
    button { margin-right: 5px; }
    #settingsSection { display: none; }
    label { display: block; margin-top: 10px; }
    select, input { width: 100%; margin-top: 5px; }
  </style>
</head>
<body>
  <div id="mainSection">
    <textarea id="selectedPost" placeholder="Selected post will appear here" readonly></textarea>
    <button id="templatizeBtn">Templatize</button>
    <textarea id="templateOutput" placeholder="Templatized output will appear here" readonly></textarea>
    <button id="openSettingsBtn">Open Settings</button>
  </div>

  <div id="settingsSection">
    <h3>Settings</h3>
    <label for="industrySelect">Your Industry:</label>
    <select id="industrySelect">
      <option value="">Select an industry</option>
      <option value="tech">Technology</option>
      <option value="finance">Finance</option>
      <option value="healthcare">Healthcare</option>
      <option value="education">Education</option>
      <option value="marketing">Marketing</option>
      <option value="other">Other</option>
    </select>
    <label for="targetMarket">Target Market:</label>
    <input type="text" id="targetMarket" placeholder="e.g., Small businesses, Millennials">
    <label for="audience">Target Audience:</label>
    <input type="text" id="audience" placeholder="e.g., CEOs, HR managers">
    <label for="keyProducts">Key Products/Services:</label>
    <input type="text" id="keyProducts" placeholder="e.g., AI software, Consulting services">
    <button id="saveSettingsBtn">Save Settings</button>
    <button id="closeSettingsBtn">Close Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
