<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templatiz</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="lib/firebase-app.js"></script>
    <script src="lib/firebase-database.js"></script>
    <script src="firebaseConfig.js"></script>
    <script src="database.js"></script>
</head>
<body>
    <nav>
        <div class="nav-left">
            <h1>Templatiz</h1>
        </div>
        <div class="nav-right">
            <button id="homeBtn">Home</button>
            <button id="settingsBtn">Settings</button>
        </div>
    </nav>

    <div id="mainView">
        <div id="originalPost">
            <h2>Original Post (<span id="postPlatform"></span>)</h2>
            <div id="postContent"></div>
        </div>
        <div id="templatizedPost">
            <h2>Templatized Post</h2>
            <textarea id="templateOutput" readonly></textarea>
        </div>
    </div>

    <div id="suggestedCategorySection" style="display: none;">
        <h3>Suggested Category</h3>
        <p id="suggestedCategory"></p>
        <p id="categoryExplanation"></p>
        <button id="acceptCategoryBtn">Accept</button>
        <button id="rejectCategoryBtn">Reject</button>
    </div>

    <select id="categorySelect"></select>

    <div id="buttonContainer">
        <div id="leftButtons">
            <button id="refreshBtn">Refresh Post</button>
        </div>
        <div id="rightButtons">
            <button id="templatizeBtn">Templatize</button>
            <button id="generateFromTemplateBtn">Generate from Template</button>
            <button id="copyToClipboardBtn">Copy to Clipboard</button>
        </div>
    </div>

    <div id="generatedPostSection" style="display: none;">
        <h2>Generated Post</h2>
        <div id="generatedPostContent"></div>
    </div>

    <div id="settingsView" style="display: none;">
        <h2>Settings</h2>
        <label for="userProfile">Your Professional Profile:</label>
        <textarea id="userProfile"></textarea>

        <label for="targetAudience">Target Audience:</label>
        <textarea id="targetAudience"></textarea>

        <h3>Categories</h3>
        <ul id="categoryList"></ul>
        <input type="text" id="newCategory" placeholder="New category">
        <button id="addCategoryBtn">Add Category</button>

        <h3>Shortcut Content</h3>
        <label for="meContent">Professional Background (/me):</label>
        <textarea id="meContent"></textarea>

        <label for="personaContent">Target Audience (/persona):</label>
        <textarea id="personaContent"></textarea>

        <button id="saveSettingsBtn">Save Settings</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
