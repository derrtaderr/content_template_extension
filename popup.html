<!DOCTYPE html>
<html>
<head>
    <title>Content Templatizer</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <h1>Content Templatizer</h1>
    
    <button id="refreshBtn">Refresh Post</button>
    
    <div id="selectedPostContainer"></div>
    
    <select id="categorySelect">
        <option value="Growth">Growth</option>
        <option value="Knowledge">Knowledge</option>
        <option value="Authority">Authority</option>
        <option value="Empathize">Empathize</option>
    </select>
    
    <button id="templatizeBtn">Templatize</button>
    
    <div id="templateResult">
        <h2>Template:</h2>
        <textarea id="templateOutput" readonly></textarea>
        <button id="copyToClipboardBtn">Copy to Clipboard</button>
    </div>
    
    <button id="openSettingsBtn">Settings</button>
    
    <div id="settingsSection" style="display: none;">
        <h2>Settings</h2>
        <label for="apiKey">API Key:</label>
        <input type="text" id="apiKey">
        <label for="industrySelect">Industry:</label>
        <select id="industrySelect">
            <!-- Add industry options here -->
        </select>
        <label for="targetMarket">Target Market:</label>
        <input type="text" id="targetMarket">
        <label for="audience">Audience:</label>
        <input type="text" id="audience">
        <label for="keyProducts">Key Products/Services:</label>
        <input type="text" id="keyProducts">
        <button id="saveSettingsBtn">Save</button>
        <button id="closeSettingsBtn">Close</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
